<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank You, Teachers!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EFE6F7; --ink:#4A2C1D; --muted:#7A5A8C; --tea:#C48A5A; --tea2:#A9693C;
  --card:#FFFFFF; --pink:#FF9FB8; --mint:#A8E0C0; --sun:#FFD27A; --sky:#9CD3F5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#241A2E; --ink:#F6E7DA; --muted:#C9B0DA; --card:#3A2B48; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#241A2E; --ink:#F6E7DA; --muted:#C9B0DA; --card:#3A2B48; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;user-select:none;-webkit-user-select:none}
h1{font-size:clamp(1.5rem,5vw,2.4rem);font-weight:700;margin:0 0 4px;letter-spacing:.01em}
.sub{margin:0 0 10px;color:var(--muted);font-size:clamp(1rem,3vw,1.2rem);min-height:1.5em}
#cup{all:unset;cursor:pointer;display:block;width:min(52vw,230px);-webkit-tap-highlight-color:transparent;transition:transform .12s}
#cup:active{transform:scale(.93) rotate(-3deg)}
#cup:focus-visible{outline:4px solid var(--pink);outline-offset:8px;border-radius:24px}
#cup svg{width:100%;height:auto;display:block;overflow:visible}
.count{margin-top:14px;font-weight:700;font-size:1.3rem}
.bar{width:min(70vw,260px);height:10px;border-radius:99px;background:color-mix(in srgb,var(--muted) 25%,transparent);margin:8px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .2s}
#layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.msg{position:absolute;max-width:min(78vw,260px);padding:12px 16px;border-radius:18px;color:#3b2417;font-weight:500;
  font-size:clamp(.95rem,3.4vw,1.1rem);line-height:1.3;box-shadow:0 6px 0 rgba(74,44,29,.18);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.msg.out{animation:fade .5s ease forwards}
@keyframes pop{from{transform:scale(.2) rotate(var(--r));opacity:0}to{transform:scale(1) rotate(var(--r));opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-24px) scale(.9) rotate(var(--r))}}
.bub{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--tea2);animation:rise .9s ease-out forwards;z-index:4}
@keyframes rise{to{transform:translate(var(--dx),-120px) scale(.3);opacity:0}}
#final{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);padding:20px}
#final.show{display:flex}
#final h2{margin:0;font-size:clamp(3.2rem,17vw,9rem);line-height:.95;font-weight:700;color:var(--tea2);
  text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--sky);animation:boom .8s cubic-bezier(.3,1.7,.5,1) both}
#final p{font-size:clamp(1.1rem,4vw,1.6rem);margin:26px 0 18px;max-width:30ch}
#final button{font:inherit;font-weight:700;font-size:1.1rem;border:0;border-radius:99px;padding:12px 28px;background:var(--pink);color:#3b2417;cursor:pointer;box-shadow:0 5px 0 rgba(74,44,29,.25)}
#final button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,44,29,.25)}
@keyframes boom{from{transform:scale(.1) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:11;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.msg,.bub,.conf,#final h2{animation-duration:.01s}}
</style>
</head>
<body>
<h1>Tap the milk tea to say thank you for the treat and the lessons in ethics</h1>
<p class="sub" id="sub">30 taps. A little surprise at the end.</p>

<button id="cup" aria-label="Milk tea. Tap to reveal a thank you message">
<svg viewBox="0 0 200 300" aria-hidden="true">
  <defs><clipPath id="clip"><path d="M30 80 L170 80 L154 270 Q152 284 138 284 L62 284 Q48 284 46 270 Z"/></clipPath></defs>
  <rect x="94" y="6" width="12" height="80" rx="6" fill="#FF9FB8" transform="rotate(8 100 46)"/>
  <rect x="22" y="58" width="156" height="26" rx="13" fill="#FFFFFF" stroke="#4A2C1D" stroke-width="5"/>
  <path d="M30 80 L170 80 L154 270 Q152 284 138 284 L62 284 Q48 284 46 270 Z" fill="#FFFFFF" fill-opacity=".55" stroke="none"/>
  <g clip-path="url(#clip)">
    <rect id="tea" x="0" y="270" width="200" height="220" fill="#C48A5A"/>
    <rect id="foam" x="0" y="270" width="200" height="10" fill="#E3B88F"/>
    <g fill="#3A2216">
      <circle cx="70" cy="270" r="9"/><circle cx="92" cy="274" r="9"/><circle cx="114" cy="270" r="9"/>
      <circle cx="136" cy="274" r="9"/><circle cx="80" cy="256" r="9"/><circle cx="103" cy="258" r="9"/><circle cx="126" cy="256" r="9"/>
    </g>
    <circle cx="68" cy="266" r="2.5" fill="#fff" opacity=".6"/><circle cx="101" cy="254" r="2.5" fill="#fff" opacity=".6"/>
  </g>
  <path d="M30 80 L170 80 L154 270 Q152 284 138 284 L62 284 Q48 284 46 270 Z" fill="none" stroke="#4A2C1D" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="82" cy="170" r="4" fill="#4A2C1D"/><circle cx="118" cy="170" r="4" fill="#4A2C1D"/>
  <path d="M90 184 Q100 194 110 184" fill="none" stroke="#4A2C1D" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="66" cy="182" rx="8" ry="5" fill="#FF9FB8" opacity=".8"/><ellipse cx="134" cy="182" rx="8" ry="5" fill="#FF9FB8" opacity=".8"/>
</svg>
</button>
<div class="count" id="count" aria-live="polite">0 / 30</div>
<div class="bar"><i id="fill"></i></div>

<div id="layer"></div>

<div id="final" role="dialog" aria-modal="true" aria-label="Thank you">
  <h2>THANK YOU!</h2>
  <p>Thank you for treating us to milk tea and for teaching us ethics.</p>
  <button id="again">Tap again</button>
</div>

<script>
// Edit these 29 messages to make them your own. Each one shows once per round, in random order.
var MESSAGES = [
  "Thank you for treating us to milk tea! It was so sweet of you.",
  "Thank you for teaching us that honesty matters, even when no one is watching.",
  "Every sip of this milk tea reminds us of your kindness.",
  "You taught us that integrity is a choice we make every day.",
  "Thank you for the milk tea and for always making time for us.",
  "You showed us that treating others with respect never goes out of style.",
  "Your generosity made our day, and we will pay it forward.",
  "Thank you for teaching us to own our mistakes and learn from them.",
  "The milk tea was delicious, but your lessons are even sweeter.",
  "You taught us that fairness starts with how we treat each other.",
  "Thank you for showing us that small gestures can mean so much.",
  "Because of you, we know the right thing is worth doing even when it is hard.",
  "Thank you for the boba, the smiles, and the good memories.",
  "You taught us to think before we act and to care about others.",
  "Thank you for being generous, and for teaching us to be generous too.",
  "You showed us that kindness is a strength.",
  "Cheers to you, our favorite teacher, with a cup of milk tea!",
  "Thank you for teaching us to do our own work and be proud of it.",
  "You taught us to listen to different points of view.",
  "Thank you for treating us like family, one cup at a time.",
  "Your example taught us more about character than any lecture.",
  "You showed us the power of empathy and gratitude.",
  "Thank you for the treat, and for believing in us.",
  "You helped us tell the difference between what is easy and what is right.",
  "Thank you for teaching us to give credit where it is due.",
  "You taught us that our choices affect other people.",
  "Thank you for the milk tea, and for shaping our conscience, too.",
  "Your values live on in how we treat the people around us.",
  "Thank you for helping us become good people, not only good students."
];
var COLORS = ["#FFD1DC","#CDEFD9","#FFE5A8","#C9E6FA","#E4D3F7","#FFCFB3"];
var TOTAL = 30, count = 0, queue = [];
var cup = document.getElementById("cup"), layer = document.getElementById("layer"),
    countEl = document.getElementById("count"), fillEl = document.getElementById("fill"),
    tea = document.getElementById("tea"), foam = document.getElementById("foam"),
    finalEl = document.getElementById("final"), sub = document.getElementById("sub");

function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rnd(a,b){ return a + Math.random()*(b-a); }

function update(){
  countEl.textContent = count + " / " + TOTAL;
  fillEl.style.width = (count/TOTAL*100) + "%";
  var y = 270 - (count/TOTAL)*185;           // tea level rises as you tap
  tea.setAttribute("y", y); foam.setAttribute("y", y);
}

function bubbles(){
  var r = cup.getBoundingClientRect();
  for (var i=0;i<5;i++){
    var b = document.createElement("span"); b.className = "bub";
    b.style.left = (r.left + r.width*rnd(.25,.75)) + "px"; b.style.top = (r.top + r.height*.3) + "px";
    b.style.setProperty("--dx", rnd(-60,60) + "px");
    document.body.appendChild(b); setTimeout(function(el){ el.remove(); }.bind(null,b), 950);
  }
}

function showMessage(text){
  var m = document.createElement("div"); m.className = "msg"; m.textContent = text;
  m.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
  m.style.setProperty("--r", rnd(-6,6).toFixed(1) + "deg");
  layer.appendChild(m);
  var w = m.offsetWidth, h = m.offsetHeight, vw = innerWidth, vh = innerHeight;
  m.style.left = rnd(8, Math.max(9, vw - w - 8)) + "px";
  m.style.top = rnd(8, Math.max(9, vh - h - 8)) + "px";
  setTimeout(function(){ m.classList.add("out"); }, 3200);
  setTimeout(function(){ m.remove(); }, 3750);
}

function confetti(){
  for (var i=0;i<90;i++){
    var c = document.createElement("i"); c.className = "conf";
    c.style.left = rnd(0,100) + "vw"; c.style.background = COLORS[i%COLORS.length];
    c.style.animationDuration = rnd(2,4.5) + "s"; c.style.animationDelay = rnd(0,1.2) + "s";
    document.body.appendChild(c); setTimeout(function(el){ el.remove(); }.bind(null,c), 6000);
  }
}

cup.addEventListener("click", function(){
  if (count >= TOTAL) return;
  count++; update(); bubbles();
  if (count < TOTAL){
    if (!queue.length) queue = shuffle(MESSAGES);
    showMessage(queue.pop());
    sub.textContent = count === 29 ? "One more tap!" : (TOTAL - count) + " taps to go";
  } else {
    layer.innerHTML = "";
    finalEl.classList.add("show"); confetti();
    document.getElementById("again").focus();
  }
});

document.getElementById("again").addEventListener("click", function(){
  count = 0; queue = shuffle(MESSAGES); update();
  finalEl.classList.remove("show"); sub.textContent = "30 taps. A little surprise at the end.";
  cup.focus();
});

queue = shuffle(MESSAGES); update();
</script>
</body>
</html>
